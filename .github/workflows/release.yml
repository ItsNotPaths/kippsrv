name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Static against musl, so one build runs on any x86_64 Linux.
    container: alpine:3.22
    env:
      LDFLAGS: -static
    permissions:
      contents: write
    steps:
      # meson, ninja and gperf build basu. socat is check.sh's client, and
      # dbus gives the bus checks a session bus instead of a skip. LLVM builds Odin.
      - name: Install build deps
        run: |
          apk add --no-cache bash build-base clang20 llvm20-dev git file tar \
              meson ninja gperf pkgconf socat dbus glib
          echo /usr/lib/llvm20/bin >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      # Odin's own releases link glibc, so it is built here.
      - name: Build Odin
        run: |
          git clone -q --depth 1 --branch dev-2026-10 https://github.com/odin-lang/Odin /opt/odin
          cd /opt/odin && LDFLAGS= ./build_odin.sh release
          echo /opt/odin >> "$GITHUB_PATH"

      # Odin's prebuilt Lua is fortified against glibc, so its 5.4.2 is built again here.
      - name: Build Lua
        run: |
          wget -qO- https://www.lua.org/ftp/lua-5.4.2.tar.gz | tar -xz -C /tmp
          LDFLAGS= make -C /tmp/lua-5.4.2/src liblua.a SYSCFLAGS=-DLUA_USE_POSIX
          cp /tmp/lua-5.4.2/src/liblua.a /opt/odin/vendor/lua/5.4/linux/liblua54.a

      - name: Build basu
        run: ./download-deps.sh

      - name: Check
        run: dbus-run-session -- ./build.sh test

      - name: Static
        run: |
          for binary in build/kippsrv build/kippbus; do
              file "$binary"
              file "$binary" | grep -q "static" || exit 1
          done

      # A prefix tree: `tar -C /usr/local -xzf` installs it, and
      # /usr/local/share is on the default XDG_DATA_DIRS.
      - name: Package
        run: |
          DESTDIR="$PWD/stage" PREFIX= ./build.sh install --version "${{ inputs.version }}"
          tar -C stage -czf "kippsrv-${{ inputs.version }}-linux-x86_64.tar.gz" bin share

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ inputs.version }}" \
              "kippsrv-${{ inputs.version }}-linux-x86_64.tar.gz" \
              --target "${{ github.sha }}" \
              --title "${{ inputs.version }}" \
              --notes "${{ inputs.notes }}" \
              $PRERELEASE_FLAG
